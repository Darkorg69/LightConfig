subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'


    group = project.property('project_group')
    version = project.property('mod_version')
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    def modId = project.property('mod_id')

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${modId}" }
        }
        manifest {
            attributes(['Specification-Title'     : mod_name,
                        'Specification-Vendor'    : authors,
                        'Specification-Version'   : project.jar.archiveVersion,
                        'Implementation-Title'    : project.name,
                        'Implementation-Version'  : project.jar.archiveVersion,
                        'Implementation-Vendor'   : authors,
                        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                        'Timestamp'               : System.currentTimeMillis(),
                        'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                        'Built-On-Minecraft'      : minecraft_version])
        }
    }

    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(17)
    }

    processResources {
        def properties = ["project_group"             : project.group,
                          "mod_id"                    : mod_id,
                          "mod_version"               : mod_version,
                          "mod_name"                  : mod_name,
                          "minecraft_version"         : minecraft_version,
                          "minecraft_version_range"   : minecraft_version_range,
                          "authors"                   : authors,
                          "license"                   : license,
                          "credits"                   : credits,
                          "mod_description"           : mod_description,
                          "displayURL"                : displayURL,
                          "issueTrackerURL"           : issueTrackerURL,
                          "sources"                   : sources,
                          "updateJSONURL"             : updateJSONURL,
                          "forge_version"             : forge_version,
                          "forge_loader_version_range": forge_loader_version_range,
                          "fabric_version"            : fabric_version,
                          "fabric_loader_version"     : fabric_loader_version,
                          "parchment_version"         : parchment_version]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand(properties)
        }
        inputs.properties(properties)
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
