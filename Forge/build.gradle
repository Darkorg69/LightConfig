plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

legacyForge {
    enable {
        setForgeVersion("${minecraft_version}-${forge_version}")
    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        create(mod_id) {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        create('client') {
            client()
            gameDirectory = file('run')
        }

        create('server') {
            server()
            gameDirectory = file('run')
            programArguments.add('nogui')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java.srcDir '../Common/src/main/java'

java {
    withSourcesJar()
}

def forgeLibs = rootProject.layout.buildDirectory.dir("libs/forge")

tasks.named('sourcesJar', Jar) {
    destinationDirectory.set(forgeLibs)
}

dependencies {
    implementation "com.electronwill.night-config:toml:3.6.4"
}

tasks.withType(Javadoc).configureEach {
    source fileTree('../Common/src/main/java')
    options.addStringOption('Xdoclint:none', '-quiet')
}

processResources {
    from '../Common/src/main/resources'
}

jar.finalizedBy('reobfJar')

tasks.matching { it.name == 'reobfJar' }.configureEach {
    if (it instanceof org.gradle.api.tasks.bundling.AbstractArchiveTask) {
        it.destinationDirectory.set(forgeLibs)
    }
}

publishing {
    publications {
        forge(MavenPublication) {
            groupId = 'com.github.darkorg69.lightconfig'
            artifactId = 'lightconfig-forge'
            artifact tasks.named('reobfJar')
            artifact tasks.named('sourcesJar')
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
